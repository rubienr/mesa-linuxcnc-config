[EMC]
MACHINE = Frida Mesa 7I95T Commissioning
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
EDITOR = nano
POSITION_OFFSET = MACHINE
POSITION_FEEDBACK = ACTUAL
INCREMENTS = 10mm 1mm 0.1mm 0.01mm 0.001mm
DEFAULT_LINEAR_VELOCITY = 5
MIN_LINEAR_VELOCITY = 0.5
MAX_LINEAR_VELOCITY = 35
MIN_FEED_OVERRIDE = 0
MAX_FEED_OVERRIDE = 1.5
MIN_SPINDLE_OVERRIDE = 0.3
MAX_SPINDLE_OVERRIDE = 1.5
DEFAULT_SPINDLE_SPEED = 800
PROGRAM_PREFIX = ./nc_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = frida-mesa.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.010
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = mesa.hal
HALFILE = general-signals.hal
HALFILE = hy-vfd.hal
HALFILE = pendant.hal
HALFILE = motion.hal

[HALUI]

[HOSTMOT2]
BOARD_IP = 192.168.1.121

[HY_VFD]
DEVICE = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
BAUD = 19200
TARGET = 1

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 35
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
TOOL_CHANGE_AT_G30 = 0

[AXIS_X]
MIN_LIMIT = 61
MAX_LIMIT = 571
MAX_VELOCITY = 35
MAX_ACCELERATION = 85

[AXIS_Y]
MIN_LIMIT = 14
MAX_LIMIT = 491
MAX_VELOCITY = 35
MAX_ACCELERATION = 85

[AXIS_Z]
MIN_LIMIT = -130
MAX_LIMIT = 0.5
MAX_VELOCITY = 35
MAX_ACCELERATION = 85

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = 61
MAX_LIMIT = 571
MAX_VELOCITY = 35
MAX_ACCELERATION = 85
FERROR = 0.01
MIN_FERROR = 0.001
SCALE = 80
STEPGEN_MAX_VEL = 36
STEPGEN_MAX_ACC = 106.25
DIRSETUP = 5000
DIRHOLD = 5000
STEPLEN = 337500
STEPSPACE = 2500
HOME = 62
HOME_OFFSET = 60
HOME_SEARCH_VEL = -30
HOME_LATCH_VEL = -2
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
HOME_SEQUENCE = 1

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = 14
MAX_LIMIT = 491
MAX_VELOCITY = 35
MAX_ACCELERATION = 85
